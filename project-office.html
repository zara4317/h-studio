    <section id="overview" class="wrap section-tight">
      <div class="grid-12">
        <div class="col-3"><p class="eyebrow">Обзор</p></div>
        <div class="off-4 prose">
          <p class="statement display" style="margin-bottom: 32px">Офис архитектурного бюро в старом доме у Патриарших прудов: рабочее пространство, которое само показывает, как бюро относится к материалу, свету и деталям.</p>
          <p>Помещение досталось с историческими окнами, высокими потолками и неровными стенами. Бюро хотело получить открытую мастерскую для команды, переговорную для встреч с заказчиками и библиотеку образцов — и при этом не спрятать характер старого дома за отделкой.</p><p>Рабочая зона вытянута вдоль окон, переговорная отделена стеклянной перегородкой, чтобы свет проходил насквозь. Входная группа с лестницей стала визитной карточкой: кирпичная стена частично раскрыта из-под штукатурки, а зона ожидания собрана из мягкой мебели и живых растений.</p>
          <details class="more">
            <summary>Материалы и решения</summary>
            <div><p>Пол — крупноформатный керамогранит под камень, стены и потолок оставлены в фактуре. Кирпич в холле раскрыт и обработан защитным составом. Акцентный синий в балках и кашпо — цвет бюро.</p><p>Столы, стойка ресепшен, кашпо-перегородки и лестница с деревянными ступенями выполнены по индивидуальным чертежам. Свет — линейные подвесы над рабочими местами и трековые споты в холле.</p></div>
          </details>
        </div>
      </div>
    </section>
    <section id="gallery" class="wrap" style="padding-bottom: 96px">

  componentDidMount() {
    this.mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    this.onMq = () => this.forceUpdate();
    if (this.mq && this.mq.addEventListener) this.mq.addEventListener('change', this.onMq);
    this.lastY = 0;
    this.onScroll = () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const scrolled = y > 40;
      const hidden = false;
      if (scrolled && this.state?.navHover && !this.state?.mega) this.setState({ navHover: false });
      let up = !!this.state?.up;
      if (up) { if (y < this.lastY) this.lastY = y; else if (y - this.lastY > 8) { up = false; this.lastY = y; } }
      else { if (y > this.lastY) this.lastY = y; else if (this.lastY - y > 8) { up = true; this.lastY = y; } }
      if (!scrolled) up = false;
      const mob = !!(window.matchMedia && window.matchMedia('(max-width: 860px)').matches);
      clearTimeout(this.idleT);
      if (scrolled && !up && !mob) this.idleT = setTimeout(() => { this.lastY = window.scrollY || document.documentElement.scrollTop || 0; if (!this.state?.up) this.setState({ up: true }); }, 250);
      const doc = document.documentElement;
      const fh = 356;
      const slot = document.querySelector('.footer-slot');
      const top = slot ? slot.getBoundingClientRect().top + y : doc.scrollHeight;
      let fp = (y + window.innerHeight - top - 16) / fh;
      fp = Math.round(Math.max(0, Math.min(1, fp)) * 25) / 25;
      if (doc.scrollHeight <= window.innerHeight + 2) fp = 1;
      if (scrolled !== this.state?.scrolled || hidden !== this.state?.hidden || up !== !!this.state?.up || mob !== !!this.state?.mob || fp !== (this.state?.fp || 0)) this.setState({ scrolled, hidden, up, mob, fp });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
    setTimeout(this.onScroll, 300);
    window.addEventListener('resize', this.onScroll);
  }
  componentWillUnmount() {
    if (this.mq && this.mq.removeEventListener) this.mq.removeEventListener('change', this.onMq);
    window.removeEventListener('scroll', this.onScroll);
  }
  logoVals() {
    const v = this.props.logo ?? 'точки';
    return { logoBeam: v !== 'точки', logoDots: v === 'точки' };
  }
  menuVals() {
    const open = !!this.state?.menuOpen;
    return {
      menuOpen: open, menuClosed: !open,
      menuClass: open ? 'is-open' : '',
      menuLabel: open ? 'Закрыть меню' : 'Открыть меню',
      toggleMenu: () => this.setState({ menuOpen: !open }),
      closeMenu: () => this.setState({ menuOpen: false }),
      mmSvc: !!this.state?.mmSvc, mmSvcCls: this.state?.mmSvc ? 'is-open' : '',
      toggleMmSvc: () => this.setState({ mmSvc: !this.state?.mmSvc })
    };
  }
  themeVals() {
    const pref = this.state?.theme || (() => { try { return localStorage.getItem('hs-theme') || 'auto'; } catch (e) { return 'auto'; } })();
    const sysDark = !!(this.mq && this.mq.matches);
    const isDark = pref === 'dark' || (pref === 'auto' && sysDark);
    return {
      themeAttr: pref === 'auto' ? '' : pref,
      isDark, isLight: !isDark,
      themeLabel: pref === 'auto' ? 'как на устройстве' : (pref === 'dark' ? 'тёмная' : 'светлая'),
      toggleTheme: () => { const t = isDark ? 'light' : 'dark'; try { localStorage.setItem('hs-theme', t); } catch (e) {} this.setState({ theme: t }); }
    };
  }
  megaVals() {
    const m = this.state?.mega || null;
    const setMega = (k) => {
      clearTimeout(this.megaT);
      const delay = k ? (this.state?.mega ? 180 : 120) : 320;
      this.megaT = setTimeout(() => { if ((this.state?.mega || null) !== k) this.setState({ mega: k, lastMega: k || this.state?.lastMega || null, sub: -1 }); }, delay);
    };
    const shown = m || this.state?.lastMega || null;
    const sub = this.state?.sub ?? -1;
    const v = { megaOpen: !!m, megaCls: m ? 'is-mega' : '', megaWrapCls: m ? 'is-open' : '', closeMega: () => setMega(null), keepMega: () => clearTimeout(this.megaT), keepSub: () => clearTimeout(this.subT) };
    for (const k of ['Projects','Services','About']) {
      v['mega'+k] = m === k;
      v['panel'+k+'Cls'] = shown === k ? 'is-on' : '';
      v['mega'+k+'Cls'] = m === k ? 'is-open' : '';
      v['open'+k] = () => setMega(k);
      v['toggle'+k] = (e) => { if (window.matchMedia && window.matchMedia('(hover: none)').matches) { e.preventDefault(); clearTimeout(this.megaT); this.setState({ mega: m === k ? null : k, lastMega: k, sub: -1 }); } };
      for (let i = 0; i < 6; i++) {
        v['sub'+k+i+'Cls'] = (shown === k && sub === i) ? 'is-hot' : '';
        v['pic'+k+i+'Cls'] = (shown === k && Math.max(sub, 0) === i) ? 'is-on' : '';
        v['hover'+k+i] = () => { clearTimeout(this.subT); this.subT = setTimeout(() => { if (this.state?.sub !== i) this.setState({ sub: i }); }, (this.state?.sub ?? -1) < 0 ? 60 : 170); };
      }
    }
    v.svcWideCls = (shown === 'Services' && (sub < 0 || sub >= 3)) ? 'is-wide' : '';
    return v;
  }
  renderVals() {
    return { headerClass: (this.state?.scrolled ? 'is-scrolled' : ''), pageClass: '', navCls: this.state?.mob ? ((!this.state?.scrolled || this.state?.menuOpen) ? 'show-nav' : 'show-burger') : ((!this.state?.scrolled || this.state?.up || this.state?.navHover || this.state?.mega || this.state?.menuOpen) ? 'show-nav' : ''), navHover: () => { if (!this.state?.navHover) this.setState({ navHover: true }); }, navLeave: () => { this.megaVals().closeMega(); if (this.state?.navHover) this.setState({ navHover: false }); }, footerP: String(this.state?.fp || 0), ...this.themeVals(), ...this.menuVals(), ...this.logoVals(), ...this.megaVals() };
  }
}
