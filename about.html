    <section class="wrap section">

        <div class="off-7 prose">
          <p class="statement display" style="margin-bottom: 32px">Архитектор и дизайнер интерьеров. Четыре года проектирую квартиры, дома и офисы — и веду их от первого чертежа до авторского надзора на объекте.</p>
          <p>Выпускница МАРХИ. Практиковать начала задолго до диплома: три года работала в архитектурном бюро, где вела проекты квартир — от планировки и коллажей до рабочих чертежей и комплектации. Сейчас работаю архитектором и веду проекты квартир, домов и офисов.</p>
          <p>Параллельно веду частные проекты — жилые и коммерческие интерьеры. Делаю всё сама: планировки, коллажи и визуализации, рабочие чертежи, подбор материалов и мебели, авторский надзор. Выезжаю на объекты в Москве и Подмосковье, с другими городами работаю по договорённости.</p>
          <p>Два года преподаю на курсах поступления в МАРХИ. Участвую в архитектурных конкурсах; ещё на третьем курсе получила награду за конкурсный проект.</p>
          <div style="margin-top: 32px"><a href="contacts.html" class="link-arrow">Познакомиться <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></div>
        </div>
      </div>
    </section>
    <section class="wrap section" style="padding-top: 0">
      <div class="section-head"><div><p class="eyebrow">Принципы</p><h2 class="h2 display">Как я работаю</h2></div></div>
      <div class="principles">
        <div class="principle"><h3>Сначала образ жизни, потом стиль</h3><p>Планировка рождается из сценариев дня: где завтракать, где работать, куда убрать вещи. Стиль приходит позже — и держится дольше.</p></div>
        <div class="principle"><h3>Один автор на всех этапах</h3><p>Чертежи, коллажи, визуализации, подбор и надзор делаю сама. Ничего не теряется при передаче между людьми, и за результат отвечает один человек.</p></div>
        <div class="principle"><h3>Проект, который можно построить</h3><p>Рабочие чертежи, понятные строителям, и авторский надзор на объекте, чтобы построенное совпало с тем, что было на визуализации.</p></div>

<script>

class Component extends DCLogic {
  componentDidMount() {
    this.mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    this.onMq = () => this.forceUpdate();
    if (this.mq && this.mq.addEventListener) this.mq.addEventListener('change', this.onMq);
    this.lastY = 0;
    this.onScroll = () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const scrolled = y > 40;
      const hidden = false;
      if (scrolled && this.state?.navHover && !this.state?.mega) this.setState({ navHover: false });
      let up = !!this.state?.up;
      if (up) { if (y < this.lastY) this.lastY = y; else if (y - this.lastY > 8) { up = false; this.lastY = y; } }
      else { if (y > this.lastY) this.lastY = y; else if (this.lastY - y > 8) { up = true; this.lastY = y; } }
      if (!scrolled) up = false;
      const mob = !!(window.matchMedia && window.matchMedia('(max-width: 860px)').matches);
      clearTimeout(this.idleT);
      if (scrolled && !up && !mob) this.idleT = setTimeout(() => { this.lastY = window.scrollY || document.documentElement.scrollTop || 0; if (!this.state?.up) this.setState({ up: true }); }, 250);
      const doc = document.documentElement;
      const fh = 356;
      const slot = document.querySelector('.footer-slot');
      const top = slot ? slot.getBoundingClientRect().top + y : doc.scrollHeight;
      let fp = (y + window.innerHeight - top - 16) / fh;
      fp = Math.round(Math.max(0, Math.min(1, fp)) * 25) / 25;
      if (doc.scrollHeight <= window.innerHeight + 2) fp = 1;
      if (scrolled !== this.state?.scrolled || hidden !== this.state?.hidden || up !== !!this.state?.up || mob !== !!this.state?.mob || fp !== (this.state?.fp || 0)) this.setState({ scrolled, hidden, up, mob, fp });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
    setTimeout(this.onScroll, 300);
    window.addEventListener('resize', this.onScroll);
  }
  componentWillUnmount() {
    if (this.mq && this.mq.removeEventListener) this.mq.removeEventListener('change', this.onMq);
    window.removeEventListener('scroll', this.onScroll);
  }
  logoVals() {
    const v = this.props.logo ?? 'точки';
    return { logoBeam: v !== 'точки', logoDots: v === 'точки' };
  }
  menuVals() {
    const open = !!this.state?.menuOpen;
    return {
      menuOpen: open, menuClosed: !open,
      menuClass: open ? 'is-open' : '',
      menuLabel: open ? 'Закрыть меню' : 'Открыть меню',
      toggleMenu: () => this.setState({ menuOpen: !open }),
      closeMenu: () => this.setState({ menuOpen: false }),
      mmSvc: !!this.state?.mmSvc, mmSvcCls: this.state?.mmSvc ? 'is-open' : '',
      toggleMmSvc: () => this.setState({ mmSvc: !this.state?.mmSvc })
    };
  }
  themeVals() {
    const pref = this.state?.theme || 'auto';
    const sysDark = !!(this.mq && this.mq.matches);
    const isDark = pref === 'dark' || (pref === 'auto' && sysDark);
    return {
      themeAttr: pref === 'auto' ? '' : pref,
      isDark, isLight: !isDark,
      themeLabel: pref === 'auto' ? 'как на устройстве' : (pref === 'dark' ? 'тёмная' : 'светлая'),
      toggleTheme: () => this.setState({ theme: isDark ? 'light' : 'dark' })
    };
  }
  megaVals() {
    const m = this.state?.mega || null;
    const setMega = (k) => {
      clearTimeout(this.megaT);
      const delay = k ? (this.state?.mega ? 0 : 60) : 160;
      this.megaT = setTimeout(() => { if ((this.state?.mega || null) !== k) this.setState({ mega: k, lastMega: k || this.state?.lastMega || null, sub: 0 }); }, delay);
    };
    const shown = m || this.state?.lastMega || null;
    const sub = this.state?.sub || 0;
    const v = { megaOpen: !!m, megaCls: m ? 'is-mega' : '', megaWrapCls: m ? 'is-open' : '', closeMega: () => setMega(null), keepMega: () => clearTimeout(this.megaT) };
    for (const k of ['Projects','Services','About']) {
      v['mega'+k] = m === k;
      v['panel'+k+'Cls'] = shown === k ? 'is-on' : '';
      v['mega'+k+'Cls'] = m === k ? 'is-open' : '';
      v['open'+k] = () => setMega(k);
      v['toggle'+k] = (e) => { if (window.matchMedia && window.matchMedia('(hover: none)').matches) { e.preventDefault(); clearTimeout(this.megaT); this.setState({ mega: m === k ? null : k, lastMega: k, sub: 0 }); } };
      for (let i = 0; i < 6; i++) {
        v['sub'+k+i+'Cls'] = (shown === k && sub === i) ? 'is-hot' : '';
        v['pic'+k+i+'Cls'] = (shown === k && sub === i) ? 'is-on' : '';
        v['hover'+k+i] = () => { if (this.state?.sub !== i) this.setState({ sub: i }); };
      }
    }
    v.svcWideCls = (shown === 'Services' && sub >= 3) ? 'is-wide' : '';
    return v;
  }
  renderVals() {
    return { headerClass: (this.state?.scrolled ? 'is-scrolled' : ''), pageClass: '', navCls: this.state?.mob ? ((!this.state?.scrolled || this.state?.menuOpen) ? 'show-nav' : 'show-burger') : ((!this.state?.scrolled || this.state?.up || this.state?.navHover || this.state?.mega || this.state?.menuOpen) ? 'show-nav' : ''), navHover: () => { if (!this.state?.navHover) this.setState({ navHover: true }); }, navLeave: () => { this.megaVals().closeMega(); if (this.state?.navHover) this.setState({ navHover: false }); }, footerP: String(this.state?.fp || 0), ...this.themeVals(), ...this.menuVals(), ...this.logoVals(), ...this.megaVals() };
  }
}

DC.mount(Component, document.getElementById('tpl'), document.getElementById('app'), {});
</script>
